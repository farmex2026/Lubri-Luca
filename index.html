<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lubri Lucas · Ficha del auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --noche:#000000;
    --panel:#000;
    --panel-2:rgba(18,34,52,.5);
    --azul:#1B4A8A;
    --neon:#41D6FF;
    --neon-2:#6C7CFF;
    --cromo:#C6D4DE;
    --texto:#EAF3F8;
    --gris:#8598A8;
    --gota:#4EE3F5;
    --gota-2:#1687C9;
    --usado:#FF7A3C;
    --verde:#3FE0A0;
    --linea:rgba(65,214,255,.16);
    --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'Roboto Mono',ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  html,body{max-width:100%;overflow-x:hidden}
  img,canvas,svg,table{max-width:100%}
  .app,.main,.enc,.kpis,.tablero,.grid2,.grid-remito,.grid-precios,.grid-sticker,.panelx,
  .tabla-caja,.turno,.cal,.fila,.chips,.filtros,.buscador,.buscador-grande{min-width:0}
  .main,.panelx,.turno,.kpi{overflow-wrap:anywhere}
  html,body{background:var(--noche)}
  body{margin:0;color:var(--texto);font-family:var(--body);-webkit-font-smoothing:antialiased;
    min-height:100vh}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(90% 45% at 50% -10%,rgba(78,227,245,.11),transparent 70%),
      radial-gradient(70% 40% at 105% 100%,rgba(108,124,255,.09),transparent 70%),
      #000}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(78,227,245,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(78,227,245,.05) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(90% 70% at 50% 15%,#000,transparent 88%);
    -webkit-mask-image:radial-gradient(90% 70% at 50% 15%,#000,transparent 88%)}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;background:rgba(0,0,0,.82);backdrop-filter:blur(2px);
    border-left:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06)}
  .wrap.ancho{max-width:780px}
  h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:.01em;line-height:1.05}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--neon);text-shadow:0 0 14px rgba(65,214,255,.5)}
  button{font-family:var(--body);cursor:pointer}
  a{color:var(--gota)}
  :focus-visible{outline:2px solid var(--neon);outline-offset:2px}
  .filo{height:1px;background:linear-gradient(90deg,transparent,var(--neon),rgba(108,124,255,.7),transparent);
    box-shadow:0 0 16px rgba(65,214,255,.55)}
  .oculto{display:none!important}

  /* ---------- HEADER FOTO ---------- */
  .hero{position:relative;aspect-ratio:16/10;background:#000;overflow:hidden}
  .hero img.foto{width:100%;height:100%;object-fit:cover;display:block}
  .hero .sinfoto{position:absolute;inset:0;display:grid;place-items:center;
    background:radial-gradient(80% 90% at 50% 20%,#0E2C4E,#000 80%)}
  .hero .sinfoto img{width:auto;height:56%;opacity:.9;filter:drop-shadow(0 0 26px rgba(65,214,255,.4))}
  .hero .velo{position:absolute;inset:0;background:
    linear-gradient(to top,#000 1%,rgba(0,0,0,.72) 34%,rgba(0,0,0,.06) 76%)}
  .hero .barrido{position:absolute;left:0;right:0;height:38%;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(65,214,255,.16),transparent);
    animation:barrer 2.6s ease-out 1 both}
  @keyframes barrer{from{transform:translateY(-45%)}to{transform:translateY(280%);opacity:0}}
  .hero .datos{position:absolute;left:18px;right:18px;bottom:15px}
  .hero .patente-gr{font-family:var(--mono);font-weight:700;font-size:clamp(27px,8.5vw,38px);letter-spacing:.05em;color:#fff;
    line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.9)}
  .hero .auto-lin{font-family:var(--display);font-weight:600;font-size:clamp(15px,4.6vw,20px);text-transform:uppercase;
    letter-spacing:.06em;color:#BFE6F6;margin-top:7px}

  .propietario{padding:12px 18px;font-size:12px;color:var(--gris);border-bottom:1px solid var(--linea);
    font-family:var(--mono);letter-spacing:.04em}
  .propietario b{color:var(--texto);font-weight:500}

  /* ---------- DATOS RÁPIDOS ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--linea);
    border-top:1px solid var(--linea);background:rgba(65,214,255,.035)}
  .stats>div{padding:14px 8px 15px;text-align:center;border-left:1px solid var(--linea)}
  .stats>div:first-child{border-left:none}
  .stats span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--gris);line-height:1.3}
  .stats b{font-family:var(--mono);font-weight:700;font-size:20px;margin-top:7px;display:block}
  .stats b.ambar{color:var(--gota);text-shadow:0 0 18px rgba(78,227,245,.6)}
  .stats b.ok{color:var(--verde);font-size:15px;font-family:var(--body);text-shadow:0 0 18px rgba(63,224,160,.5)}
  .stats b.pronto{color:var(--gota);font-size:15px;font-family:var(--body);text-shadow:0 0 18px rgba(78,227,245,.5)}
  .stats b.mal{color:var(--usado);font-size:15px;font-family:var(--body);text-shadow:0 0 18px rgba(255,122,60,.5)}

  .saludo{padding:22px 18px 0}
  .saludo h2{font-size:28px;font-weight:700}
  .saludo h2 em{font-style:normal;color:var(--neon);text-shadow:0 0 22px rgba(65,214,255,.6)}
  .saludo p{margin:6px 0 0;font-size:13px;color:var(--gris)}

  /* ---------- PANEL PRÓXIMO SERVICE (firma) ---------- */
  .calco-zona{padding:18px 18px 4px}
  .calco{position:relative;border-radius:6px;padding:19px 20px 20px;overflow:hidden;
    background:linear-gradient(155deg,rgba(20,44,72,.7),rgba(0,0,0,.92));
    border:1px solid rgba(65,214,255,.3);
    box-shadow:0 0 44px -14px rgba(65,214,255,.55),inset 0 1px 0 rgba(255,255,255,.06)}
  .calco::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(65,214,255,.09) 50%,transparent 60%)}
  .calco::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(78,227,245,.22),transparent 70%);pointer-events:none}
  .calco.vencido{border-color:rgba(255,122,60,.45);
    background:linear-gradient(155deg,rgba(78,32,10,.72),rgba(0,0,0,.94));
    box-shadow:0 0 46px -14px rgba(255,122,60,.6)}
  .calco .titulo{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--gris)}
  .calco.vencido .titulo{color:var(--usado)}
  .calco .km{font-family:var(--display);font-size:clamp(38px,12vw,52px);font-weight:700;line-height:.94;margin:8px 0 0;
    color:var(--gota);text-shadow:0 0 30px rgba(78,227,245,.55)}
  .calco.vencido .km{color:#FFB489;text-shadow:0 0 30px rgba(255,122,60,.6)}
  .calco .km small{font-size:19px;font-weight:600;opacity:.6;margin-left:6px}
  .calco .fecha{font-family:var(--mono);font-size:13px;font-weight:500;margin-top:6px;color:#CFE6F2}
  .calco .oquepase{font-size:11.5px;line-height:1.45;margin-top:9px;color:var(--gris);max-width:36ch}
  .varilla{margin-top:16px}
  .varilla .pista{position:relative;height:9px;border-radius:5px;background:rgba(65,214,255,.12);
    overflow:hidden;box-shadow:inset 0 0 0 1px rgba(65,214,255,.18)}
  .varilla .lleno{position:absolute;left:0;top:0;bottom:0;border-radius:5px;
    background:linear-gradient(90deg,#6C7CFF,var(--neon) 60%,#DFFBFF);
    box-shadow:0 0 18px rgba(78,227,245,.8);transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .calco.vencido .varilla .lleno{background:linear-gradient(90deg,var(--gota),var(--usado))}
  .varilla .marcas{position:absolute;inset:0;display:flex;justify-content:space-between;padding:0 22%}
  .varilla .marcas i{width:1px;background:rgba(255,255,255,.35)}
  .varilla .pie{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gris)}
  .estado{display:inline-block;margin-top:15px;font-family:var(--mono);font-size:11px;font-weight:500;
    padding:7px 12px;border-radius:4px;color:var(--gota);background:rgba(78,227,245,.1);
    border:1px solid rgba(78,227,245,.4);box-shadow:0 0 20px -6px rgba(78,227,245,.7)}
  .calco.vencido .estado{color:#FFC0A0;background:rgba(255,122,60,.12);border-color:rgba(255,122,60,.5)}

  /* ---------- SECCIONES ---------- */
  .sec{padding:22px 18px}
  .sec-tit{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:9px;margin-bottom:15px;
    border-bottom:1px solid var(--linea)}
  .sec-tit h2{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}

  .visita{display:grid;grid-template-columns:46px minmax(0,1fr);gap:11px;padding:14px 0;border-bottom:1px solid var(--linea)}
  .visita:last-child{border-bottom:none}
  .visita .n{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--neon);height:28px;
    display:grid;place-items:center;border-radius:4px;background:rgba(65,214,255,.08);
    border:1px solid rgba(65,214,255,.3);box-shadow:0 0 18px -6px rgba(65,214,255,.8)}
  .visita .f{font-family:var(--mono);font-size:12.5px;font-weight:500}
  .visita .km2{font-family:var(--mono);font-size:11.5px;color:var(--gris);margin-top:2px}
  .visita ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .visita li{background:rgba(65,214,255,.06);border:1px solid rgba(65,214,255,.16);border-radius:3px;
    padding:3px 8px;font-size:11.5px;color:#BBD6E4}
  .visita .nota{font-size:12px;color:var(--gris);margin-top:7px;line-height:1.45;font-style:italic}
  .ultimo{display:inline-block;background:var(--gota);color:#01151E;font-family:var(--body);
    font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;vertical-align:1px;margin-left:7px;
    box-shadow:0 0 16px -3px rgba(78,227,245,.9)}
  .vacio{background:rgba(65,214,255,.05);border:1px dashed var(--linea);border-radius:5px;padding:20px;
    text-align:center;font-size:13px;color:var(--gris)}

  .pie-taller{padding:26px 18px 34px;border-top:1px solid var(--linea);background:#000}
  .pie-taller .fila-logo{display:flex;align-items:center;gap:13px}
  .pie-taller img{height:56px;filter:drop-shadow(0 0 18px rgba(65,214,255,.35))}
  .pie-taller h3{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .pie-taller p{margin:5px 0 0;font-size:12.5px;color:#9BB4C4;line-height:1.6}
  .pie-taller p b{color:var(--verde);font-family:var(--mono);font-weight:500}
  .wa-zona{padding:16px 18px 4px}
  .pie-taller .wa-zona{padding:18px 0 0}
  .wa{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin:0;
    background:linear-gradient(180deg,#2BE778,#12B457);color:#04240F;text-decoration:none;
    font-weight:700;font-size:15px;padding:15px 18px;border-radius:9px;border:none;
    box-shadow:0 0 30px -8px rgba(37,211,102,.85)}
  .wa svg{width:20px;height:20px;margin:0}
  .fab{position:fixed;bottom:20px;right:18px;z-index:20;display:flex;align-items:center;gap:9px;
    background:linear-gradient(180deg,#2BE778,#12B457);color:#04240F;text-decoration:none;font-weight:700;
    font-size:14px;padding:14px 19px;border-radius:34px;
    box-shadow:0 0 34px -6px rgba(37,211,102,.85),0 10px 26px -8px rgba(0,0,0,.7)}
  .fab svg{width:22px;height:22px}
  .fab span{white-space:nowrap}
  @media (min-width:560px){.fab{right:calc(50% - 260px + 16px)}}

  /* chapa patente (listado del taller) */
  .chapa{display:inline-block;background:#F4F6F7;border:1px solid #05090D;border-radius:5px;overflow:hidden}
  .chapa .franja{background:#123C8C;color:#fff;font-family:var(--mono);font-size:6px;letter-spacing:.14em;
    text-align:center;padding:2px 8px 1.5px}
  .chapa .nro{font-family:var(--mono);font-weight:700;color:#05090D;font-size:17px;letter-spacing:.09em;
    padding:3px 9px 5px;text-align:center}
  .chapa.chica .nro{font-size:13px;padding:2px 7px 3px}
  .chapa.chica .franja{font-size:5px}
  .contador{display:none}

  /* ---------- TALLER ---------- */
  .barra{display:flex;align-items:center;gap:10px;padding:11px 16px;position:sticky;top:0;z-index:5;
    background:rgba(0,0,0,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--linea)}
  .barra img{height:30px}
  .barra h2{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;flex:1;color:#CFE6F2}
  .btn{border:none;border-radius:5px;padding:11px 15px;font-size:13.5px;font-weight:600;
    background:rgba(65,214,255,.09);color:var(--texto);border:1px solid var(--linea)}
  .btn.ambar{background:linear-gradient(135deg,#8CF2FF,#2FA9E8 60%,#6C7CFF);color:#01151E;border-color:transparent;
    box-shadow:0 0 24px -8px rgba(78,227,245,.9)}
  .btn.linea{background:transparent;border:1px solid rgba(65,214,255,.35);color:#BFE6F6}
  .btn.chico{padding:7px 11px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}
  .fila{display:flex;gap:8px;flex-wrap:wrap}
  label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gris);margin:15px 0 6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid rgba(65,214,255,.22);border-radius:5px;
    font-family:var(--body);font-size:15px;background:#05080C;color:var(--texto)}
  input:focus,textarea:focus{border-color:var(--neon);outline:none;box-shadow:0 0 22px -6px rgba(65,214,255,.9)}
  input[type=file]{padding:9px;font-size:13px}
  input[type=date]{color-scheme:dark}
  textarea{min-height:66px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .chk{margin:0;font-size:13px;letter-spacing:0;text-transform:none;color:var(--texto);
    display:flex;align-items:center;gap:7px;background:rgba(65,214,255,.07);padding:9px 12px;border-radius:5px;
    border:1px solid var(--linea)}
  .chk input{width:auto}
  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--neon) 50%),linear-gradient(135deg,var(--neon) 50%,transparent 50%);
    background-position:calc(100% - 17px) 19px,calc(100% - 11px) 19px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px}
  .card{background:var(--panel-2);border-radius:6px;padding:14px;margin-bottom:10px;
    border:1px solid var(--linea);box-shadow:0 0 30px -18px rgba(65,214,255,.9)}
  .card .top{display:flex;align-items:center;gap:11px}
  .card .info{flex:1;min-width:0}
  .card .info b{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;
    display:block;line-height:1.1;letter-spacing:.03em}
  .card .info span{font-family:var(--mono);font-size:11px;color:var(--gris)}
  .pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:4px 8px;border-radius:4px;
    white-space:nowrap;text-transform:uppercase;border:1px solid transparent}
  .pill.ok{background:rgba(63,224,160,.12);color:var(--verde);border-color:rgba(63,224,160,.35)}
  .pill.pronto{background:rgba(78,227,245,.12);color:var(--gota);border-color:rgba(78,227,245,.4)}
  .pill.mal{background:rgba(255,122,60,.14);color:var(--usado);border-color:rgba(255,122,60,.45);font-weight:700}

  .sticker-prev{background:#05080C;border-radius:9px;padding:14px;border:1px solid var(--linea)}
  .sticker-prev canvas{width:100%;height:auto;display:block;border-radius:10px}
  .paleta{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
  .paleta button{aspect-ratio:1;border-radius:9px;border:2px solid transparent;padding:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .paleta button[aria-pressed=true]{border-color:var(--neon);box-shadow:0 0 0 3px rgba(65,214,255,.3)}
  .nombre-color{text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gris);margin-top:10px}
  #qrOculto{position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none}

  .bloque{background:rgba(65,214,255,.05);border:1px solid var(--linea);border-radius:8px;padding:14px}
  .dato-alm{font-family:var(--mono);font-size:11.5px;color:var(--gris);line-height:1.5}
  .dato-alm b{color:var(--neon);font-weight:500}
  .centro.alto p{margin-bottom:24px}
  .sec>.fila{margin-bottom:4px}
  .aviso{background:rgba(78,227,245,.09);border-left:2px solid var(--gota);padding:12px 14px;font-size:12.5px;
    line-height:1.5;border-radius:0 5px 5px 0;margin-top:14px;color:#D8E4EC}
  .msg{font-family:var(--mono);font-size:11px;color:var(--verde);min-height:15px;margin-top:9px;line-height:1.5}
  .msg.err{color:var(--usado)}
  .centro{min-height:86vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:34px 24px}
  .centro img.logo{display:block;width:140px;margin:0 auto 20px;
    filter:drop-shadow(0 0 30px rgba(65,214,255,.4))}
  .centro .eyebrow{display:block;margin-bottom:10px}
  .centro h1{font-size:31px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
  .centro p{color:var(--gris);font-size:14px;line-height:1.6;margin:0 auto 22px;max-width:32ch}
  .centro .bloque{width:100%;max-width:290px;text-align:left}


  /* ================= PANEL DE ESCRITORIO ================= */
  .wrap.taller{max-width:none;border:none;background:#000}
  .app{display:grid;grid-template-columns:242px minmax(0,1fr);min-height:100vh;max-width:1560px;margin:0 auto}
  .lat{border-right:1px solid var(--linea);padding:22px 14px;position:sticky;top:0;height:100vh;
    display:flex;flex-direction:column}
  .lat .marca{display:flex;align-items:center;gap:11px;margin:0 6px 22px}
  .lat .marca img{height:46px;filter:drop-shadow(0 0 16px rgba(65,214,255,.3))}
  .lat .marca b{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;display:block;line-height:1.1}
  .lat .marca span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav a{display:block;padding:11px 13px;border-radius:7px;color:#9FB6C6;text-decoration:none;
    font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent}
  .nav a:hover{background:rgba(65,214,255,.07);color:#fff}
  .nav a.on{background:rgba(65,214,255,.12);color:var(--neon);border-color:var(--linea)}
  .lat-pie{margin-top:auto;padding:12px 8px 0;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gris);border-top:1px solid var(--linea)}

  .main{padding:28px 34px 70px;min-width:0}
  .enc{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    margin-bottom:24px;padding-bottom:17px;border-bottom:1px solid var(--linea)}

var ULT_ERROR='';
function esperar(ms){return new Promise(function(s){setTimeout(s,ms)})}

/* Guarda en la nube del artefacto si existe; si no, en este navegador. */
var ALM=(function(){
  var nube=(typeof window.storage==='object'&&window.storage&&typeof window.storage.set==='function');
  if(nube)return{tipo:'nube',
    get:function(k){return window.storage.get(k,true)},
    set:function(k,v){return window.storage.set(k,v,true)},
    del:function(k){return window.storage.delete(k,true)}};
  return{tipo:'local',
    get:function(k){var v=null;try{v=localStorage.getItem('LL_'+k)}catch(e){}
      return Promise.resolve(v==null?null:{value:v})},
    set:function(k,v){return new Promise(function(res,rej){
      try{localStorage.setItem('LL_'+k,v);res(true)}
      catch(e){rej(new Error('se llenó el espacio del navegador, borrá alguna foto vieja'))}})},
    del:function(k){try{localStorage.removeItem('LL_'+k)}catch(e){}return Promise.resolve(true)}};
})();

}

function proximo(a){

  var u=v[v.length-1];

  var d=dias(pf);
  return {fecha:pf,km:pk,dias:d,usado:Math.min(100,Math.round(pasados/total*100)),
          estado:d<0?'mal':(d<=30?'pronto':'ok'),desde:u.fecha,kmUlt:u.km};
}

  var d=pr.dias;

}

function waNum(s){
  var d=String(s||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.indexOf('54')===0)d=d.slice(2);
  if(d.indexOf('9')===0)d=d.slice(1);
  d=d.replace(/^0/,'');
  return '549'+d;
}
function waLink(a,pat){
  var n=waNum(DB.config.whatsapp);if(!n)return '';
  var t='Hola '+(DB.config.nombre||'Lubri Lucas')+'! Quiero pedir turno para el '+
        vehiculo(a)+' ('+patLinda(pat)+').';
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(t);
}

}

function tabla(filas,cabeceras){
  if(!filas)return '<div class="vacio">No hay datos para mostrar.</div>';
  // en celular cada fila se ve como tarjeta: etiquetamos las celdas con su columna
  var i=-1;
  filas=filas.replace(/<tr([^>]*)>|<td([^>]*)>/g,function(m,tr,td){
    if(tr!==undefined){i=-1;return m}
    i++;
    var c=(i===0?'':cabeceras[i])||'';
    return c&&td.indexOf('data-t')<0?'<td data-t="'+c.replace(/"/g,'')+'"'+td+'>':m;
  });
  return '<div class="tabla-caja"><table class="tabla"><thead><tr><th>'+cabeceras.join('</th><th>')+
    '</th></tr></thead><tbody>'+filas+'</tbody></table></div>';

function turnos(){if(!DB.turnos)DB.turnos=[];return DB.turnos}
function turnosDe(iso){return turnos().filter(function(t){return t.fecha===iso&&t.estado==='pendiente'})}
function turnosOrden(l){return l.sort(function(x,y){return (x.fecha+x.hora)<(y.fecha+y.hora)?-1:1})}

function calendario(){
  var h0=hoy();
  if(CAL.m==null){CAL.m=h0.getMonth();CAL.a=h0.getFullYear()}
  var desplaz=(new Date(CAL.a,CAL.m,1).getDay()+6)%7;
  var dias=new Date(CAL.a,CAL.m+1,0).getDate(),celdas='';
  for(var i=0;i<desplaz;i++)celdas+='<div class="dia vacia"></div>';
  for(var d=1;d<=dias;d++){
    var iso=CAL.a+'-'+String(CAL.m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var n=turnosDe(iso).length;
    celdas+='<div class="dia'+(iso===isoHoy()?' hoy':'')+(iso===CAL.sel?' sel':'')+(n?' con':'')+
      '" onclick="elegirDia(\''+iso+'\')"><b>'+d+'</b>'+(n?'<i>'+n+'</i>':'')+'</div>';
  }
  return '<div class="cal">'+
    '<div class="cal-top"><button class="btn linea chico" onclick="irMes(-1)">‹</button>'+
      '<b>'+MESES[CAL.m]+' '+CAL.a+'</b>'+
      '<button class="btn linea chico" onclick="irMes(1)">›</button></div>'+
    '<div class="cal-sem">'+DIAS_SEM.map(function(d){return '<span>'+d+'</span>'}).join('')+'</div>'+
    '<div class="cal-grid">'+celdas+'</div></div>';
}
function irMes(d){
  if(CAL.m==null){var h0=hoy();CAL.m=h0.getMonth();CAL.a=h0.getFullYear()}
  CAL.m+=d;if(CAL.m<0){CAL.m=11;CAL.a--}if(CAL.m>11){CAL.m=0;CAL.a++}
  vistaTaller();
}

  var e=document.getElementById('t_h');if(e)e.focus()}

function autoTurno(){
  var p=normPat(document.getElementById('t_pat').value),a=DB.autos[p];

  if(!document.getElementById('t_cli').value)document.getElementById('t_cli').value=a.cliente||'';
  if(!document.getElementById('t_tel').value)document.getElementById('t_tel').value=a.telefono||'';
  if(!document.getElementById('t_veh').value)document.getElementById('t_veh').value=vehiculo(a);

async function guardarTurno(){
  var m=document.getElementById('mt');
  var hora=document.getElementById('t_h').value;
  var cli=document.getElementById('t_cli').value.trim();
  var pat=normPat(document.getElementById('t_pat').value);
  if(!hora){m.className='msg err';m.textContent='Poné la hora del turno.';return}
  if(!cli&&!pat){m.className='msg err';m.textContent='Poné al menos la patente o el nombre del cliente.';return}
  turnos().push({id:'t'+Date.now(),fecha:CAL.sel,hora:hora,patente:pat,
    cliente:cli,telefono:document.getElementById('t_tel').value.trim(),
    vehiculo:document.getElementById('t_veh').value.trim(),
    servicio:document.getElementById('t_srv').value.trim(),
    notas:document.getElementById('t_n').value.trim(),estado:'pendiente'});
  m.className='msg';m.textContent='Guardando…';
  var ok=await guardar();
  if(!ok){m.className='msg err';m.textContent='No se pudo guardar: '+(ULT_ERROR||'reintentá');return}
  vistaTaller();
}
async function cerrarTurno(id,estado){

}

/* ---------- INICIO ---------- */
function vistaTaller(){
  var pats=autosOrdenados(),h0=hoy(),m0=h0.getMonth(),a0=h0.getFullYear();
  var vencidos=0,esteMes=0,serviciosMes=0;
  pats.forEach(function(p){
    var pr=proximo(DB.autos[p]);
    if(pr){if(pr.dias<0)vencidos++;
      else{var f=new Date(pr.fecha+'T12:00');if(f.getMonth()===m0&&f.getFullYear()===a0)esteMes++}}
    (DB.autos[p].visitas||[]).forEach(function(v){
      var f=new Date(v.fecha+'T12:00');
      if(f.getMonth()===m0&&f.getFullYear()===a0)serviciosMes++});
  });
  var hoyIso=isoHoy();
  var pend=turnosOrden(turnos().filter(function(t){return t.estado==='pendiente'}));
  var atrasados=pend.filter(function(t){return t.fecha<hoyIso});
  var deHoy=pend.filter(function(t){return t.fecha===hoyIso});
  var siguientes=pend.filter(function(t){return t.fecha>hoyIso}).slice(0,15);
  var porVencer=pats.filter(function(p){var pr=proximo(DB.autos[p]);return pr&&pr.dias<=45}).slice(0,6);

  pantalla('inicio','Inicio','Los turnos del día y el calendario para agendar.',
    '<div class="buscador-grande">'+
      '<input id="bq" list="patsb" placeholder="Buscá por patente: AB123CD" autocomplete="off" '+
        'onkeydown="if(event.key===\'Enter\')buscarPat()">'+
      '<datalist id="patsb">'+optPatentes()+'</datalist>'+
      '<button class="btn ambar" onclick="buscarPat()">Ver historial</button>'+
    '</div><div class="msg err" id="mb"></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span>Turnos de hoy</span><b class="neon">'+deHoy.length+'</b></div>'+
      '<div class="kpi"><span>Services este mes</span><b>'+serviciosMes+'</b></div>'+
      '<div class="kpi"><span>Vencen este mes</span><b class="ambar">'+esteMes+'</b></div>'+
      '<div class="kpi"><span>Vencidos</span><b class="rojo">'+vencidos+'</b></div>'+
    '</div>'+
    '<div class="tablero">'+
      '<div>'+
        (atrasados.length?'<h2 class="sub-tit rojo-t">Turnos sin cerrar</h2>'+atrasados.map(tarjetaTurno).join(''):'')+
        '<h2 class="sub-tit">Hoy · '+dFecha(hoyIso)+'</h2>'+

function buscarPat(){

function vistaFlota(filtro){

  var f=document.getElementById('ff');

function exportarFlota(){
  var c=function(s){s=String(s==null?'':s);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var l=['patente,vehiculo,cliente,telefono,services_totales,fecha_service,km,aceite,litros,filtros,proximo_km,proxima_fecha,notas'];
  Object.keys(DB.autos).sort().forEach(function(p){
    var a=DB.autos[p],vs=(a.visitas||[]);
    var base=[p,vehiculo(a),a.cliente||'',a.telefono||'',vs.length];
    if(!vs.length){l.push(base.concat(['','','','','','','']).map(c).join(','));return}
    vs.forEach(function(v){
      var f=[];
      if(v.fAceite)f.push('aceite');if(v.fAire)f.push('aire');
      if(v.fHabit)f.push('habitaculo');if(v.fComb)f.push('combustible');
      l.push(base.concat([v.fecha,v.km,v.aceite||'',v.litros||'',f.join(' '),v.proxKm||'',v.proxFecha||'',v.notas||'']).map(c).join(','));
    });
  });
  var d=document.createElement('a');
  d.href=URL.createObjectURL(new Blob(['\ufeff'+l.join('\n')],{type:'text/csv;charset=utf-8'}));
  d.download='LubriLucas-flota-'+isoHoy()+'.csv';d.click();
}

    aviso+

      '<div class="panelx">'+altaHTML+
        '<label>Kilometraje de hoy</label>'+
        '<input id="o_km" class="grande" inputmode="numeric" placeholder="'+(u.km?fmt(u.km):'ej. 98500')+'" oninput="recalcOrden()">'+
        '<label>Fecha</label><input id="o_f" type="date" value="'+(t?esc(t.fecha):isoHoy())+'" oninput="recalcOrden()">'+
        '<label>Trabajos realizados</label><div class="chips">'+chips+'</div>'+

function abrirOrden(){
  var q=normPat(document.getElementById('bo').value);
  if(DB.autos[q])return vistaOrden(q);
  document.getElementById('mo').textContent='Esa patente no está cargada. Creala con "+ Auto nuevo".';
}
function lts(d){
  var i=document.getElementById('o_l');
  var v=Math.max(0,(parseFloat(String(i.value).replace(',','.'))||0)+d);
  i.value=String(Math.round(v*10)/10).replace('.',',');
}
function recalcOrden(){
  var km=Number(String(document.getElementById('o_km').value).replace(/\D/g,''));
  var f=document.getElementById('o_f').value||isoHoy();
  var pk=document.getElementById('o_pk'),pf=document.getElementById('o_pf');
  if(km&&!pk.dataset.tocado)pk.value=km+Number(DB.config.intKm);
  if(!pf.dataset.tocado)pf.value=sumaMeses(f,DB.config.intMeses);
  pk.onchange=function(){pk.dataset.tocado=1};
  pf.onchange=function(){pf.dataset.tocado=1};
}
async function guardarOrden(pat,destino,turnoId){
  var m=document.getElementById('mo2');
  var campoPat=document.getElementById('o_pat');
  if(campoPat){
    var p=normPat(campoPat.value);
    if(p.length<5){m.className='msg err';m.textContent='Escribí una patente válida (ej: AB123CD).';return}
    var prev=DB.autos[p]||{visitas:[]};
    DB.autos[p]={vehiculo:document.getElementById('o_veh').value.replace(/\s+/g,' ').trim(),
      cliente:document.getElementById('o_cli').value.trim(),
      telefono:document.getElementById('o_tel').value.trim(),
      visitas:prev.visitas||[]};
    pat=p;
  }
  var km=Number(String(document.getElementById('o_km').value).replace(/\D/g,''));
  if(!km){m.className='msg err';m.textContent='Falta el kilometraje de hoy.';return}
  ['bo1','bo2','bo3'].forEach(function(b){var e=document.getElementById(b);if(e)e.disabled=true});
  m.className='msg';m.textContent='Guardando…';
  var fecha=document.getElementById('o_f').value||isoHoy();
  var v={fecha:fecha,km:km,
    aceite:document.getElementById('o_ac').value.trim(),
    litros:document.getElementById('o_l').value.trim(),
    proxKm:Number(String(document.getElementById('o_pk').value).replace(/\D/g,''))||km+Number(DB.config.intKm),
    proxFecha:document.getElementById('o_pf').value||sumaMeses(fecha,DB.config.intMeses),
    notas:document.getElementById('o_n').value.trim()};
  TRABAJOS.forEach(function(x){v[x[0]]=document.getElementById('c_'+x[0]).classList.contains('on')});
  DB.autos[pat].visitas=(DB.autos[pat].visitas||[]).concat([v])
    .sort(function(x,y){return x.fecha<y.fecha?-1:1});
  if(turnoId){
    var t=turnos().filter(function(x){return x.id===turnoId})[0];
    if(t){t.estado='hecho';if(!t.patente)t.patente=pat}
  }
  var ok=await guardar();
  ['bo1','bo2','bo3'].forEach(function(b){var e=document.getElementById(b);if(e)e.disabled=false});
  if(!ok){m.className='msg err';m.textContent='No se pudo guardar: '+(ULT_ERROR||'reintentá');return}
  m.textContent='Service guardado'+(turnoId?' y turno cerrado.':'.');
  setTimeout(function(){
    if(destino==='remito')vistaRemito(pat);
    else if(destino==='sticker')verSticker(pat);
    else verAuto(pat);
  },500);
}

  var esc=(window.innerWidth<=640&&disp)?Math.min(1,disp/520):1;
  caja.style.setProperty('--esc',esc);

async function pdfRemito(){
  if(typeof html2canvas==='undefined'||!window.jspdf)throw new Error('librerías no disponibles');
  var hoja=document.querySelector('#hoja .hoja-in');
  var cv=await html2canvas(hoja,{scale:2,backgroundColor:'#ffffff',logging:false});
  var img=cv.toDataURL('image/jpeg',.92);
  var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  var an=190,al=cv.height*an/cv.width;
  pdf.addImage(img,'JPEG',10,10,an,Math.min(al,277));
  return pdf.output('blob');
}

async function guardarRemito(){
  leerREM();
  var m=document.getElementById('mr'),a=DB.autos[REM.pat];
  a.direccion=REM.dir;a.entrecalles=REM.ent;a.localidad=REM.loc;
  if(REM.cli)a.cliente=REM.cli;

  if(!DB.remitos)DB.remitos=[];
  DB.remitos=DB.remitos.filter(function(r){return r.nro!==REM.nro});
  DB.remitos.push({nro:REM.nro,fecha:REM.fecha,pat:REM.pat,cli:REM.cli,total:REM.total,
    items:REM.soloTotal?[]:REM.items,soloTotal:REM.soloTotal,obs:REM.obs});

  (REM.soloTotal?[]:REM.items).forEach(function(it){
    var d=String(it.d).trim(),p=Number(String(it.p).replace(/[^0-9.]/g,''))||0;
    if(!d||!p)return;
    cat=cat.filter(function(x){return x.d.toLowerCase()!==d.toLowerCase()});

  });

async function enviarRemito(){

var RUBROS=[['aceite','Aceites'],['filtro','Filtros']];
var PRE={rubro:'aceite',filtro:'',imp:null};
function precios(){
  if(!DB.precios)DB.precios={aceite:[],filtro:[]};
  if(!DB.precios.aceite)DB.precios.aceite=[];
  if(!DB.precios.filtro)DB.precios.filtro=[];
  return DB.precios;
}
function nombreRubro(r){return (RUBROS.filter(function(x){return x[0]===r})[0]||['','?'])[1]}
function precioNum(v){
  if(typeof v==='number')return v;
  var s=String(v==null?'':v).replace(/[^0-9.,-]/g,'');
  if(!s)return 0;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(s.indexOf(',')>=0)s=s.replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  else if(s.indexOf('.')>=0&&/\.\d{3}$/.test(s))s=s.replace(/\./g,'');
  return Number(s)||0;
}

  pantalla('ajustes','Lista de precios · '+nombreRubro(PRE.rubro),
    lista.length+' ítems cargados. Cada rubro se importa y se descarga por separado.',
    '<div class="fila" style="margin-bottom:16px">'+RUBROS.map(function(r){
      return '<div class="chip'+(r[0]===PRE.rubro?' on':'')+'" onclick="vistaPrecios(\''+r[0]+'\')">'+
        r[1]+' ('+precios()[r[0]].length+')</div>'}).join('')+'</div>'+
    '<div class="grid-precios">'+
      '<div class="panelx">'+
        '<label>Aumentar precios de '+nombreRubro(PRE.rubro)+'</label>'+
        '<div class="fila"><input id="p_pct" inputmode="decimal" placeholder="% de aumento, ej. 12" style="flex:1">'+
        '<button class="btn ambar" onclick="aumentarPrecios()">Aplicar</button></div>'+
        '<div class="dato-alm" style="margin-top:9px">Se aplica a los '+lista.length+' ítems del rubro y redondea a la decena. '+
          'Podés poner un número negativo para bajar precios.</div>'+
        '<div class="msg" id="mp2"></div>'+
      '</div>'+
      '<div class="panelx">'+
        '<label>Planilla del rubro</label>'+
        '<div class="fila"><button class="btn linea" onclick="bajarPrecios()">Descargar CSV</button>'+
        '<button class="btn linea" onclick="formImportarPrecios()">Importar Excel</button></div>'+
        '<div class="dato-alm" style="margin-top:9px">Formato: columna 1 código, columna 2 descripción, columna 3 precio final.</div>'+
      '</div>'+
    '</div>'+
    '<h2 class="sub-tit">Ítems</h2>'+
    '<div class="buscador"><input id="pf" placeholder="Buscar por código o descripción" value="'+esc(PRE.filtro)+'" '+
      'oninput="clearTimeout(window.__tp);window.__tp=setTimeout(function(){vistaPrecios(null,document.getElementById(\'pf\').value)},350)"></div>'+
    (filas?tabla(filas,['Código','Descripción','Precio','Queda','']):'<div class="vacio">Sin ítems. Importá la planilla o agregá uno a mano.</div>')+
    '<div class="fila" style="margin-top:14px"><button class="btn ambar" onclick="guardarPrecios()">Guardar cambios</button>'+
    '<button class="btn linea" onclick="agregarPrecio()">+ Ítem</button></div>'+
    '<div class="msg" id="mp3"></div>',
    '<button class="btn linea" onclick="formConfig()">← Volver a Ajustes</button>');
  window.__vista=vistaPrecios;

  if(f&&PRE.filtro){f.focus();f.setSelectionRange(f.value.length,f.value.length)}

async function guardarPrecios(){
  var lista=precios()[PRE.rubro],m=document.getElementById('mp3');
  lista.forEach(function(x,i){
    var k=document.getElementById('pk_'+i),d=document.getElementById('pd_'+i),c=document.getElementById('pc_'+i);
    if(k)x.cod=k.value.trim();
    if(d)x.desc=d.value.trim();
    if(c)x.precio=precioNum(c.value);
  });
  m.className='msg';m.textContent='Guardando…';

async function agregarPrecio(){
  precios()[PRE.rubro].unshift({cod:'',desc:'',precio:0});
  await guardar();vistaPrecios(null,'');
}
async function borrarPrecio(i){
  precios()[PRE.rubro].splice(i,1);await guardar();vistaPrecios();
}
async function aumentarPrecios(){
  var m=document.getElementById('mp2');
  var pct=Number(String(document.getElementById('p_pct').value).replace(',','.'));
  if(!pct){m.className='msg err';m.textContent='Escribí el porcentaje.';return}
  var lista=precios()[PRE.rubro];
  lista.forEach(function(x){
    x.precio=Math.round((precioNum(x.precio)*(1+pct/100))/10)*10;
  });
  var ok=await guardar();
  if(!ok){m.className='msg err';m.textContent='No se pudo guardar: '+(ULT_ERROR||'reintentá');return}
  vistaPrecios();
  var m2=document.getElementById('mp2');
  if(m2){m2.className='msg';m2.textContent=(pct>0?'Aumento':'Baja')+' de '+pct+'% aplicado a '+lista.length+' ítems.'}
}
function bajarPrecios(){
  var lista=precios()[PRE.rubro];
  var c=function(s){s=String(s==null?'':s);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  var l=['codigo,descripcion,precio'];
  lista.forEach(function(x){l.push([x.cod,x.desc,precioNum(x.precio)].map(c).join(','))});
  var d=document.createElement('a');
  d.href=URL.createObjectURL(new Blob(['\ufeff'+l.join('\n')],{type:'text/csv;charset=utf-8'}));
  d.download='LubriLucas-precios-'+PRE.rubro+'-'+isoHoy()+'.csv';d.click();

    '</div><div class="panelx" id="prevp"><div class="vacio">Subí el archivo para ver la vista previa.</div></div></div>',
    '<button class="btn linea" onclick="vistaPrecios()">← Volver a la lista</button>');
  window.__vista=formImportarPrecios;

async function leerPlanillaPrecios(e){
  var f=e.target.files[0],m=document.getElementById('mip');
  if(!f)return;
  m.className='msg';m.textContent='Leyendo…';
  try{
    if(typeof XLSX==='undefined')throw new Error('no se pudo cargar el lector de Excel');
    var wb=XLSX.read(await f.arrayBuffer(),{cellDates:false});
    var filas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    var items=[];
    filas.forEach(function(r,i){
      var cod=String(r[0]==null?'':r[0]).trim();
      var desc=String(r[1]==null?'':r[1]).trim();
      var p=precioNum(r[2]);
      if(i===0&&!p)return;
      if(!cod&&!desc)return;
      items.push({cod:cod,desc:desc,precio:p});
    });
    if(!items.length)throw new Error('no encontré filas con datos');
    PRE.imp=items;
    m.textContent=items.length+' ítems leídos de la hoja "'+wb.SheetNames[0]+'".';
    document.getElementById('prevp').innerHTML=
      '<label>Vista previa</label>'+
      tabla(items.slice(0,8).map(function(x){
        return '<tr><td class="pat">'+esc(x.cod)+'</td><td>'+esc(x.desc)+'</td><td class="num">'+pesos(x.precio)+'</td></tr>'}).join(''),
        ['Código','Descripción','Precio'])+
      '<div class="fila" style="margin-top:14px">'+
        '<button class="btn ambar" onclick="aplicarPrecios(\'reemplazar\')">Reemplazar la lista</button>'+
        '<button class="btn linea" onclick="aplicarPrecios(\'sumar\')">Agregar y actualizar</button></div>';
  }catch(err){m.className='msg err';m.textContent='No pude leer la planilla: '+err.message}
}
async function aplicarPrecios(modo){
  var m=document.getElementById('mip'),items=PRE.imp||[];
  if(!items.length)return;
  if(modo==='reemplazar')precios()[PRE.rubro]=items.slice();
  else{
    var lista=precios()[PRE.rubro];
    items.forEach(function(x){
      var ex=lista.filter(function(y){return (y.cod||'').toUpperCase()===(x.cod||'').toUpperCase()&&x.cod})[0];
      if(ex){ex.desc=x.desc||ex.desc;ex.precio=x.precio}
      else lista.push(x);
    });
  }
  m.className='msg';m.textContent='Guardando…';
  var ok=await guardar();
  if(!ok){m.className='msg err';m.textContent='No se pudo guardar: '+(ULT_ERROR||'reintentá');return}
  PRE.imp=null;vistaPrecios();
}

var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function optMes(sel){return MESES.map(function(m,i){
  return '<option value="'+i+'"'+(i===sel?' selected':'')+'>'+m+'</option>'}).join('')}
function optAnio(sel){var y=hoy().getFullYear(),o='';
  for(var i=y-4;i<=y+2;i++)o+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'</option>';return o}

function vistaVencimientos(mes,anio){
  var h0=hoy();
  mes=(mes==null?h0.getMonth():Number(mes));anio=(anio==null?h0.getFullYear():Number(anio));
  var vencidos=[],delMes=[];
  Object.keys(DB.autos).forEach(function(p){
    var pr=proximo(DB.autos[p]);if(!pr)return;
    var f=new Date(pr.fecha+'T12:00');
    if(pr.dias<0)vencidos.push([p,pr]);
    if(f.getMonth()===mes&&f.getFullYear()===anio)delMes.push([p,pr]);
  });
  var orden=function(l){return l.sort(function(x,y){return x[1].dias-y[1].dias})};
  var fila=function(par){
    var p=par[0],pr=par[1],a=DB.autos[p];
    var tel=waNum(a.telefono);
    var msg='Hola'+(a.cliente?' '+String(a.cliente).split(' ')[0]:'')+'! Te escribo de '+(DB.config.nombre||'Lubri Lucas')+
      '. Al '+vehiculo(a)+' ('+patLinda(p)+') le toca el cambio de aceite '+
      (pr.dias<0?'desde el '+dFecha(pr.fecha):'el '+dFecha(pr.fecha))+' o a los '+fmt(pr.km)+' km. ¿Querés que te reserve un turno?';
    return '<tr><td class="pat"><a onclick="verAuto(\''+p+'\')">'+esc(patLinda(p))+'</a></td>'+
      '<td>'+esc(vehiculo(a))+'</td>'+
      '<td>'+esc(a.cliente||'—')+'<span class="sub">'+esc(a.telefono||'sin teléfono')+'</span></td>'+
      '<td class="num">'+fmt(pr.km)+'</td>'+
      '<td>'+dFecha(pr.fecha)+'</td>'+
      '<td><span class="pill '+pr.estado+'">'+textoEstado(pr)+'</span></td>'+
      '<td>'+(tel?'<a class="btn linea chico" target="_blank" rel="noopener" href="https://wa.me/'+tel+
        '?text='+encodeURIComponent(msg)+'">Recordar</a>':'—')+'</td></tr>'};
  var cab=['Patente','Vehículo','Cliente','Próx. km','Fecha','Estado','Aviso'];

  pantalla('vence','Por vencer','Elegí el mes y avisale a cada cliente con un clic.',
    '<div class="filtros">'+
      '<div><label>Mes</label><select id="vm" onchange="vistaVencimientos(this.value,document.getElementById(\'va\').value)">'+optMes(mes)+'</select></div>'+
      '<div><label>Año</label><select id="va" onchange="vistaVencimientos(document.getElementById(\'vm\').value,this.value)">'+optAnio(anio)+'</select></div>'+
    '</div>'+
    '<div class="kpis"><div class="kpi"><span>Vencen en '+MESES[mes]+' '+anio+'</span><b class="ambar">'+delMes.length+'</b></div>'+
      '<div class="kpi"><span>Vencidos a hoy</span><b class="rojo">'+vencidos.length+'</b></div></div>'+
    '<h2 class="sub-tit">Vencen en '+MESES[mes]+' de '+anio+'</h2>'+
    (delMes.length?tabla(orden(delMes).map(fila).join(''),cab):'<div class="vacio">Ningún auto vence en ese mes.</div>')+
    '<h2 class="sub-tit">Ya vencidos</h2>'+
    (vencidos.length?tabla(orden(vencidos).map(fila).join(''),cab):'<div class="vacio">No hay autos vencidos. Todo al día.</div>'),'');
}

/* ---------- REPORTES ---------- */
function vistaReportes(m1,a1,m2,a2){
  var h0=hoy();
  a1=(a1==null?h0.getFullYear():Number(a1));m1=(m1==null?0:Number(m1));
  a2=(a2==null?h0.getFullYear():Number(a2));m2=(m2==null?h0.getMonth():Number(m2));
  var desde=a1+'-'+String(m1+1).padStart(2,'0')+'-01';
  var finMes=new Date(a2,m2+1,0).getDate();
  var hasta=a2+'-'+String(m2+1).padStart(2,'0')+'-'+String(finMes).padStart(2,'0');

  var reg=[];
  Object.keys(DB.autos).forEach(function(p){
    (DB.autos[p].visitas||[]).forEach(function(v){
      if(v.fecha>=desde&&v.fecha<=hasta)reg.push([p,v]);
    });
  });
  reg.sort(function(x,y){return x[1].fecha<y[1].fecha?1:-1});
  var litros=0,autos={},fil={aceite:0,aire:0,habit:0,comb:0};
  reg.forEach(function(r){
    litros+=parseFloat(String(r[1].litros||'0').replace(',','.'))||0;
    autos[r[0]]=1;
    if(r[1].fAceite)fil.aceite++;if(r[1].fAire)fil.aire++;
    if(r[1].fHabit)fil.habit++;if(r[1].fComb)fil.comb++;
  });
  var filas=reg.map(function(r){
    var p=r[0],v=r[1],a=DB.autos[p],f=[];
    if(v.fAceite)f.push('aceite');if(v.fAire)f.push('aire');
    if(v.fHabit)f.push('habitáculo');if(v.fComb)f.push('combustible');
    return '<tr><td>'+dFecha(v.fecha)+'</td><td class="pat"><a onclick="verAuto(\''+p+'\')">'+esc(patLinda(p))+'</a></td>'+
      '<td>'+esc(vehiculo(a))+'</td>'+
      '<td>'+esc(a.cliente||'—')+'</td><td class="num">'+fmt(v.km)+'</td>'+
      '<td>'+esc(v.aceite||'—')+'</td><td class="num">'+esc(v.litros||'—')+'</td>'+
      '<td>'+(f.length?esc(f.join(', ')):'—')+'</td></tr>'}).join('');
  window.__rep=reg;

  pantalla('reporte','Reportes','Services realizados entre dos meses.',
    '<div class="filtros">'+
      '<div><label>Desde mes</label><select id="r1m">'+optMes(m1)+'</select></div>'+
      '<div><label>Año</label><select id="r1a">'+optAnio(a1)+'</select></div>'+
      '<div><label>Hasta mes</label><select id="r2m">'+optMes(m2)+'</select></div>'+
      '<div><label>Año</label><select id="r2a">'+optAnio(a2)+'</select></div>'+
      '<div style="align-self:end"><button class="btn ambar" onclick="vistaReportes(document.getElementById(\'r1m\').value,'+
        'document.getElementById(\'r1a\').value,document.getElementById(\'r2m\').value,document.getElementById(\'r2a\').value)">Ver</button></div>'+
    '</div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span>Services</span><b>'+reg.length+'</b></div>'+
      '<div class="kpi"><span>Autos distintos</span><b class="neon">'+Object.keys(autos).length+'</b></div>'+
      '<div class="kpi"><span>Litros de aceite</span><b class="ambar">'+String(Math.round(litros*10)/10).replace('.',',')+'</b></div>'+
      '<div class="kpi"><span>Filtros</span><b>'+(fil.aceite+fil.aire+fil.habit+fil.comb)+'</b>'+
        '<i>aceite '+fil.aceite+' · aire '+fil.aire+' · hab. '+fil.habit+' · comb. '+fil.comb+'</i></div>'+
    '</div>'+
    '<h2 class="sub-tit">Detalle · '+MESES[m1]+' '+a1+' a '+MESES[m2]+' '+a2+'</h2>'+
    (filas?tabla(filas,['Fecha','Patente','Vehículo','Cliente','Km','Aceite','Litros','Filtros'])
      :'<div class="vacio">No hay services en ese período.</div>'),
    (reg.length?'<button class="btn linea" onclick="bajarReporte()">Descargar CSV</button>':''));
}
function bajarReporte(){
  var reg=window.__rep||[];
  var l=['fecha,patente,vehiculo,cliente,telefono,km,aceite,litros,filtros,notas'];
  reg.forEach(function(r){
    var p=r[0],v=r[1],a=DB.autos[p],f=[];
    if(v.fAceite)f.push('aceite');if(v.fAire)f.push('aire');
    if(v.fHabit)f.push('habitaculo');if(v.fComb)f.push('combustible');
    var c=function(s){s=String(s==null?'':s);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    l.push([v.fecha,p,vehiculo(a),a.cliente,a.telefono,v.km,v.aceite,v.litros,f.join(' '),v.notas].map(c).join(','));
  });
  var d=document.createElement('a');
  d.href=URL.createObjectURL(new Blob(['\ufeff'+l.join('\n')],{type:'text/csv;charset=utf-8'}));
  d.download='LubriLucas-reporte.csv';d.click();
}

  pantalla('flota',pat?('Editar '+patLinda(pat)):'Nuevo auto','Los datos y la foto que ve el cliente en su ficha.',

      '<label>Patente</label><input id="f_pat" class="grande" value="'+esc(pat||'')+'" placeholder="AB123CD" '+
        (pat?'disabled':'')+' style="text-transform:uppercase">'+
      '<label>Vehículo</label><input id="f_veh" value="'+esc(vehiculo(a))+'" placeholder="Ford Focus 2016">'+
      '<label>Teléfono</label><input id="f_tel" value="'+esc(a.telefono)+'" placeholder="11 5555 5555">'+
      '<label>Nombre del cliente</label><input id="f_cli" value="'+esc(a.cliente)+'" placeholder="Marcela Gómez">'+
      '<div class="msg" id="m1"></div>'+
      '<div class="fila" style="margin-top:16px"><button class="btn ambar" id="bg" onclick="guardarAuto(\''+(pat||'')+'\')">Guardar auto</button>'+
      (pat?'<button class="btn linea" onclick="borrarAuto(\''+pat+'\')">Borrar</button>':'')+'</div>'+
    '</div><div class="panelx">'+
      '<label>Foto del auto</label><input id="f_foto" type="file" accept="image/*">'+
      '<div id="prev" style="margin-top:12px">'+(foto?'<img src="'+foto+'" style="width:100%;border-radius:8px;border:1px solid var(--linea)">':
        '<div class="vacio">Sin foto. Va en el encabezado de la ficha del cliente.</div>')+'</div>'+
    '</div></div>',
    pat?'<button class="btn linea" onclick="verAuto(\''+pat+'\')">Ver historial</button>':'');

  window.__fotoNueva=null;
  document.getElementById('f_foto').addEventListener('change',function(e){
    var file=e.target.files[0];if(!file)return;
    var r=new FileReader();
    var m1=document.getElementById('m1'),bg=document.getElementById('bg');
    m1.className='msg';m1.textContent='Procesando la foto…';bg.disabled=true;
    r.onload=function(){var im=new Image();
      im.onerror=function(){m1.className='msg err';m1.textContent='No pude leer esa imagen. Probá con otra.';bg.disabled=false};
      im.onload=function(){
        var ancho=760,q=.68,d='';
        for(var i=0;i<6;i++){
          var s=Math.min(1,ancho/im.width),cv=document.createElement('canvas');
          cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
          var cx=cv.getContext('2d');cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(im,0,0,cv.width,cv.height);
          d=cv.toDataURL('image/jpeg',q);
          if(d.length<300000)break;
          q-=.1;if(q<.4){q=.55;ancho-=140}
        }
        window.__fotoNueva=d;
        document.getElementById('prev').innerHTML='<img src="'+d+'" style="width:100%;border-radius:8px;border:1px solid var(--linea)">';
        m1.textContent='Foto lista ('+Math.round(d.length/1400)+' KB). Ahora guardá el auto.';
        bg.disabled=false;
      };im.src=r.result};
    r.onerror=function(){m1.className='msg err';m1.textContent='No pude abrir el archivo.';bg.disabled=false};
    r.readAsDataURL(file);
  });

function patLinda(p){
  if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p))return p.slice(0,2)+' '+p.slice(2,5)+' '+p.slice(5);
  if(/^[A-Z]{3}\d{3}$/.test(p))return p.slice(0,3)+' '+p.slice(3);
  return p;
}
function qrElemento(texto){
  return new Promise(function(res,rej){
    var caja=document.getElementById('qrOculto');
    caja.innerHTML='';
    try{new QRCode(caja,{text:texto,width:560,height:560,colorDark:'#000000',colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.M})}catch(e){return rej(e)}
    setTimeout(function(){
      var c=caja.querySelector('canvas');
      if(c)return res(c);
      var im=caja.querySelector('img');
      if(!im)return rej(new Error('sin qr'));
      if(im.complete&&im.naturalWidth)return res(im);
      im.onload=function(){res(im)};im.onerror=function(){rej(new Error('sin qr'))};
    },40);
  });
}
function redondo(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function espaciar(ctx,v){try{ctx.letterSpacing=v}catch(e){}}

async function dibujarSticker(pat){
  var a=DB.autos[pat],pr=proximo(a),c=DB.config;
  var col=PALETA[Number(c.stickerColor)||0]||PALETA[0];
  var base=(c.base||location.href).split('#')[0], url=base+'#p='+pat;
  var cv=document.getElementById('lienzo');
  var W=1000,H=580,S=2;
  cv.width=W*S;cv.height=H*S;
  var ctx=cv.getContext('2d');
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,W,H);
  try{await document.fonts.ready}catch(e){}

  var claro=col.t==='claro';
  var tinta=claro?'#FFFFFF':'#0B141D';
  var tinta2=claro?'rgba(255,255,255,.66)':'rgba(11,20,29,.6)';
  var ac=col.ac;

  /* silueta con esquinas biseladas */
  function figura(){
    var r=22,ch=58;
    ctx.beginPath();
    ctx.moveTo(r,0);
    ctx.lineTo(W-ch,0);ctx.lineTo(W,ch);
    ctx.lineTo(W,H-r);ctx.quadraticCurveTo(W,H,W-r,H);
    ctx.lineTo(ch,H);ctx.lineTo(0,H-ch);
    ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
    ctx.closePath();
  }
  figura();ctx.save();ctx.clip();

  var g=ctx.createLinearGradient(0,0,W*.8,H);
  g.addColorStop(0,col.a);g.addColorStop(1,col.b);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  /* grilla técnica */
  ctx.globalAlpha=claro?.055:.07;
  ctx.strokeStyle=claro?'#CFE9FF':'#0B141D';ctx.lineWidth=1;
  for(var gx=40;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}
  for(var gy=40;gy<H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
  ctx.globalAlpha=1;

  /* resplandor de acento */
  var gl=ctx.createRadialGradient(120,H+40,10,120,H+40,460);
  gl.addColorStop(0,ac);gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=claro?.22:.16;ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;

  /* filo lateral encendido */
  var gf=ctx.createLinearGradient(0,0,0,H);
  gf.addColorStop(0,'rgba(0,0,0,0)');gf.addColorStop(.5,ac);gf.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gf;ctx.fillRect(0,0,9,H);
  ctx.restore();

  /* borde */
  figura();ctx.strokeStyle=claro?'rgba(255,255,255,.22)':'rgba(11,20,29,.2)';ctx.lineWidth=2;ctx.stroke();

  /* --- encabezado: logo + nombre --- */
  if(LOGO_IMG.complete&&LOGO_IMG.naturalWidth){
    var lh=58,lw=LOGO_IMG.naturalWidth*lh/LOGO_IMG.naturalHeight;
    ctx.drawImage(LOGO_IMG,44,26,lw,lh);
  }
  ctx.textBaseline='alphabetic';ctx.fillStyle=tinta;
  espaciar(ctx,'2px');
  ctx.font='600 23px Inter, system-ui, sans-serif';
  ctx.fillText((c.nombre||'Lubri Lucas').toUpperCase(),112,60);
  espaciar(ctx,'2.4px');
  ctx.font='500 14px "Roboto Mono", ui-monospace, monospace';
  ctx.fillStyle=ac;
  ctx.fillText('FICHA DIGITAL DE SERVICE',113,82);
  espaciar(ctx,'0px');

  /* divisor */
  var gd=ctx.createLinearGradient(44,0,600,0);
  gd.addColorStop(0,ac);gd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gd;ctx.fillRect(44,112,556,2);

  /* --- patente --- */
  var texto=patLinda(pat),tam=88;
  ctx.font='700 '+tam+'px "Roboto Mono", ui-monospace, monospace';
  while(ctx.measureText(texto).width>530&&tam>42){tam-=4;ctx.font='700 '+tam+'px "Roboto Mono", ui-monospace, monospace'}
  ctx.fillStyle=tinta;ctx.fillText(texto,46,218);

  /* --- auto --- */
  var auto=vehiculo(a).toUpperCase();
  var tam2=32;ctx.font='600 '+tam2+'px "Barlow Condensed", Inter, sans-serif';
  espaciar(ctx,'1px');
  while(ctx.measureText(auto).width>530&&tam2>18){tam2-=2;ctx.font='600 '+tam2+'px "Barlow Condensed", Inter, sans-serif'}
  ctx.fillStyle=tinta2;ctx.fillText(auto,48,258);
  espaciar(ctx,'0px');

  /* --- pastilla próximo cambio --- */
  var etq=pr?('PRÓXIMO: '+fmt(pr.km)+' KM'):'PRIMER CAMBIO PENDIENTE';
  ctx.font='700 26px Inter, system-ui, sans-serif';
  espaciar(ctx,'1px');
  var anchoP=Math.min(ctx.measureText(etq).width+44,520);
  redondo(ctx,46,286,anchoP,54,6);
  ctx.fillStyle=claro?'rgba(255,255,255,.13)':'rgba(11,20,29,.1)';ctx.fill();
  ctx.strokeStyle=ac;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=claro?'#FFFFFF':tinta;ctx.fillText(etq,68,321);
  espaciar(ctx,'0px');

  if(pr){
    ctx.font='500 22px "Roboto Mono", ui-monospace, monospace';
    ctx.fillStyle=tinta2;ctx.fillText('o el '+dFecha(pr.fecha),48,376);
  }

  /* --- pie: instrucción + teléfono --- */
  ctx.font='500 20px Inter, system-ui, sans-serif';
  ctx.fillStyle=tinta2;
  ctx.fillText('Escaneá el QR y mirá el historial completo de tu auto',48,478);

  var tel=String(c.whatsapp||'').trim();
  if(tel){
    espaciar(ctx,'1.5px');
    ctx.font='700 30px "Roboto Mono", ui-monospace, monospace';
    var tw=ctx.measureText(tel).width;
    redondo(ctx,44,506,tw+108,50,6);
    ctx.fillStyle=claro?'rgba(255,255,255,.1)':'rgba(11,20,29,.08)';ctx.fill();
    ctx.strokeStyle=claro?'rgba(255,255,255,.3)':'rgba(11,20,29,.22)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=ac;
    ctx.font='700 15px Inter, system-ui, sans-serif';
    ctx.fillText('TURNOS',62,530);
    ctx.fillStyle=tinta;
    ctx.font='700 30px "Roboto Mono", ui-monospace, monospace';
    ctx.fillText(tel,144,540);
    espaciar(ctx,'0px');
  }

  /* --- panel QR con corchetes --- */
  var qr=await qrElemento(url);
  var Q=300,PX=17,PL=Q+PX*2,px=W-46-PL,py=104;
  redondo(ctx,px,py,PL,PL,12);
  ctx.fillStyle='#FFFFFF';ctx.fill();
  ctx.drawImage(qr,px+PX,py+PX,Q,Q);
  ctx.strokeStyle=ac;ctx.lineWidth=3;
  var o=11,br=26;
  [[px-o,py-o,1,1],[px+PL+o,py-o,-1,1],[px-o,py+PL+o,1,-1],[px+PL+o,py+PL+o,-1,-1]].forEach(function(p){
    ctx.beginPath();
    ctx.moveTo(p[0]+p[2]*br,p[1]);ctx.lineTo(p[0],p[1]);ctx.lineTo(p[0],p[1]+p[3]*br);ctx.stroke();
  });
  ctx.font='700 19px "Roboto Mono", ui-monospace, monospace';
  espaciar(ctx,'4px');ctx.textAlign='center';ctx.fillStyle=tinta;
  ctx.fillText('ESCANEAME',px+PL/2,py+PL+42);
  espaciar(ctx,'0px');ctx.textAlign='left';
}

var IMP={filas:[],cols:[],mapa:{}};

function normCab(s){return String(s==null?'':s).toLowerCase().normalize('NFD')
  .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}

function fechaISO(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))
    return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  var s=String(v).trim();
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){var y=m[3].length===2?('20'+m[3]):m[3];
    return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  if(/^\d{5}$/.test(s)){
    var d=new Date(Date.UTC(1899,11,30)+Number(s)*864e5);
    return d.toISOString().slice(0,10)}
  return '';
}
function aNum(v){var d=String(v==null?'':v).replace(/[^0-9]/g,'');return d?Number(d):0}

function formImportar(){
  pantalla('flota','Importar planilla','Una fila por service. Si un auto vino cinco veces, van cinco filas con la misma patente.',
    '<div class="grid2"><div class="panelx">'+
      '<label>Archivo Excel o CSV</label><input type="file" id="arch" accept=".xlsx,.xls,.csv,text/csv">'+
      '<div class="msg" id="mi"></div>'+
      '<div class="fila" style="margin-top:14px"><button class="btn linea chico" onclick="planillaModelo()">Descargar planilla modelo</button></div>'+
      '<div class="aviso">Reconoce solo los encabezados: patente o dominio, cliente o propietario, km, fecha, aceite, litros, filtros, observaciones. Podés corregir cualquiera a mano.</div>'+
    '</div><div class="panelx" id="mapeo"><div class="vacio">Subí un archivo para ver las columnas.</div></div></div>',
    '<button class="btn linea" onclick="vistaFlota()">← Volver a la flota</button>');
  document.getElementById('arch').addEventListener('change',leerPlanilla);
}
async function leerPlanilla(e){
  var f=e.target.files[0],m=document.getElementById('mi');
  if(!f)return;
  m.className='msg';m.textContent='Leyendo el archivo…';
  try{
    if(typeof XLSX==='undefined')throw new Error('no se pudo cargar el lector de Excel, revisá la conexión');
    var wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
    var hoja=wb.Sheets[wb.SheetNames[0]];
    var filas=XLSX.utils.sheet_to_json(hoja,{defval:'',raw:true});
    if(!filas.length)throw new Error('la primera hoja está vacía');
    var cols=[];
    filas.slice(0,40).forEach(function(r){Object.keys(r).forEach(function(k){if(cols.indexOf(k)<0)cols.push(k)})});
    IMP.filas=filas;IMP.cols=cols;IMP.mapa={};
    CAMPOS.forEach(function(c){
      for(var i=0;i<cols.length;i++){if(c.alt.indexOf(normCab(cols[i]))>=0){IMP.mapa[c.k]=cols[i];return}}
      IMP.mapa[c.k]='';
    });
    m.textContent=filas.length+' filas leídas en la hoja "'+wb.SheetNames[0]+'".';
    pintarMapeo();
  }catch(err){m.className='msg err';m.textContent='No pude leer la planilla: '+err.message}
}

function pintarMapeo(){
  var op=function(sel){return '<option value="">— ninguna —</option>'+IMP.cols.map(function(c){
    return '<option value="'+esc(c)+'"'+(c===sel?' selected':'')+'>'+esc(c)+'</option>'}).join('')};
  document.getElementById('mapeo').innerHTML=
    '<label>Qué columna es cada dato</label>'+
    '<div class="g2">'+CAMPOS.map(function(c){
      return '<div><label style="margin-top:8px">'+c.n+(c.req?' *':'')+'</label>'+
        '<select onchange="IMP.mapa[\''+c.k+'\']=this.value">'+op(IMP.mapa[c.k])+'</select></div>'}).join('')+
    '</div>'+
    '<div class="aviso">Patente y fecha son obligatorias. Las filas que no las tengan se saltean y te aviso cuántas fueron.</div>'+
    '<button class="btn ambar" style="margin-top:14px" id="bimp" onclick="hacerImport()">Importar a la flota</button>';
}

async function hacerImport(){
  var m=document.getElementById('mi'),b=document.getElementById('bimp');
  if(!IMP.mapa.patente||!IMP.mapa.fecha){
    m.className='msg err';m.textContent='Elegí primero las columnas de patente y de fecha.';return}
  b.disabled=true;m.className='msg';m.textContent='Importando…';
  var v=function(fila,k){var c=IMP.mapa[k];return c?fila[c]:''};
  var nuevosAutos=0,nuevasVisitas=0,saltadas=0;

  IMP.filas.forEach(function(fila){
    var pat=normPat(v(fila,'patente'));
    var fecha=fechaISO(v(fila,'fecha'));
    if(pat.length<5||!fecha){saltadas++;return}
    var a=DB.autos[pat];
    if(!a){a=DB.autos[pat]={vehiculo:'',cliente:'',telefono:'',visitas:[]};nuevosAutos++}
    var veh=[v(fila,'marca'),v(fila,'vehiculo'),v(fila,'anio')]
      .map(function(x){return String(x==null?'':x).trim()}).filter(Boolean).join(' ');
    if(veh&&!a.vehiculo)a.vehiculo=vehiculo({vehiculo:veh});
    ['cliente','telefono'].forEach(function(k){
      var val=String(v(fila,k)||'').trim();
      if(val&&!a[k])a[k]=val;
    });
    if((a.visitas||[]).some(function(x){return x.fecha===fecha&&x.km===aNum(v(fila,'km'))}))return;
    var fl=normCab(v(fila,'filtros'));
    var km=aNum(v(fila,'km'));
    var pf=fechaISO(v(fila,'proxfecha'));
    a.visitas.push({
      fecha:fecha,km:km,
      aceite:String(v(fila,'aceite')||'').trim(),
      litros:String(v(fila,'litros')||'').trim(),
      fAceite:fl.indexOf('aceite')>=0||!fl,
      fAire:fl.indexOf('aire')>=0,
      fHabit:fl.indexOf('habitaculo')>=0||fl.indexOf('polen')>=0,
      fComb:fl.indexOf('combustible')>=0||fl.indexOf('nafta')>=0,
      proxKm:aNum(v(fila,'proxkm'))||(km+Number(DB.config.intKm)),
      proxFecha:pf||sumaMeses(fecha,DB.config.intMeses),
      notas:String(v(fila,'notas')||'').trim()
    });
    nuevasVisitas++;
  });

  for(var p in DB.autos)DB.autos[p].visitas.sort(function(x,y){return x.fecha<y.fecha?-1:1});
  var ok=await guardar();
  b.disabled=false;
  if(!ok){m.className='msg err';m.textContent='No se pudo guardar: '+(ULT_ERROR||'reintentá');return}
  m.className='msg';
  m.textContent='Listo: '+nuevosAutos+' autos nuevos, '+nuevasVisitas+' services cargados'+
    (saltadas?', '+saltadas+' filas salteadas por falta de patente o fecha':'')+'.';
  setTimeout(vistaFlota,1800);
}

function planillaModelo(){
  var cab='patente,vehiculo,cliente,telefono,fecha,km,aceite,litros,filtros,proximo km,notas';
  var ej=['AB123CD,Volkswagen Gol Trend 2016,Marcela Gomez,11 5555 5555,08/11/2024,78400,10W40 semisintetico,4,aceite aire,88400,',
          'AB123CD,,,,21/06/2025,89100,10W40 semisintetico,4,aceite,99100,Cubierta trasera con poca presion'];
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+cab+'\n'+ej.join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download='LubriLucas-planilla-modelo.csv';a.click();
}

/* ============ router ============ */
async function router(){
  var h=(location.hash||'').replace(/^#/,'');
  if(h.indexOf('p=')===0)return vistaCliente(normPat(h.slice(2)));
  return autorizado?vistaTaller():pedirPin();
}
window.addEventListener('hashchange',router);
window.addEventListener('resize',function(){if(typeof escalarHoja==='function')escalarHoja()});
(async function(){await cargar();router()})();
</script>
